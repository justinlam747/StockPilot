name: Local forecast release
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'forecast_app/**'
      - 'stockpilot_local/**'
      - 'tests/**'
      - 'scripts/local.mjs'
      - 'scripts/queue-broker.mjs'
      - 'scripts/setup-redis.py'
      - 'scripts/package_forecast.py'
      - 'requirements.txt'
      - 'package*.json'
      - 'README.md'
      - '.github/workflows/local-forecast.yml'
  push:
    tags: ['stockpilot-local-v*']

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install macOS trainer and queue dependencies
        if: runner.os == 'macOS'
        run: brew install libomp valkey
      - name: Install the Linux queue server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: python scripts/package_forecast.py
      - run: python -m zipfile -e dist/stockpilot-local.zip dist/verify
      - name: Install and build the exported app
        working-directory: dist/verify/StockPilot
        run: |
          npm run setup
          npm run build
      - name: Test training, persistence and request handling
        shell: bash
        working-directory: dist/verify/StockPilot
        run: |
          if [ -f .venv/Scripts/python.exe ]; then py=.venv/Scripts/python.exe; else py=.venv/bin/python; fi
          "$py" -m pip install pytest
          "$py" -m pytest tests
          node --test tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: stockpilot-local
          path: dist/stockpilot-local.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/stockpilot-local-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stockpilot-local
      - name: Attach the verified local app to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" stockpilot-local.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" stockpilot-local.zip --repo "$GITHUB_REPOSITORY" --verify-tag --title "StockPilot local forecast $TAG" --notes "Download stockpilot-local.zip, extract it and follow the README to train on your own weekly sales."
          fi
