client_id = "20afdf418d6ed8240cee854d5b171a69"
name = "StockPilot"
application_url = "https://your-connector.example/connect"
embedded = false

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_inventory,read_products"
use_legacy_install_flow = true

[auth]
redirect_urls = ["https://your-connector.example/auth/shopify/callback"]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app_uninstalled"

[[webhooks.subscriptions]]
topics = ["products/update"]
uri = "/webhooks/products_update"

[[webhooks.subscriptions]]
topics = ["products/delete"]
uri = "/webhooks/products_delete"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "/gdpr/customers_data_request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "/gdpr/customers_redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "/gdpr/shop_redact"
